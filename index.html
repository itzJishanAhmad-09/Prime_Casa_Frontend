<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="google-site-verification" content="Y_dcU7_6EcWO_qpAVuz54mXeVUmxNsvS-b3zH4T1fhw" />

    <!-- ===== PRIMARY META TAGS ===== -->
    <title>The Prime Casa – Turning Dreams into Addresses</title>
    <meta
      name="description"
      content="Find RERA-verified properties in Noida & Greater Noida. Zero brokerage, 100% trusted real estate advisory by The Prime Casa. Explore luxury villas, apartments, commercial spaces, and residential plots."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="The Prime Casa" />
    <meta name="theme-color" content="#C0392B" />

    <!-- ===== FAVICON ===== -->
    <link rel="icon" href="/primecasa.webp" type="image/webp" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="64x64" />
    <link rel="apple-touch-icon" href="/primecasa.webp" />

    <!-- ===== OPEN GRAPH (Facebook, WhatsApp, LinkedIn) ===== -->
    <meta property="og:title" content="The Prime Casa – Turning Dreams into Addresses" />
    <meta
      property="og:description"
      content="Find RERA-verified properties in Noida & Greater Noida. Zero brokerage, 100% trusted real estate advisory."
    />
    <meta property="og:image" content="https://theprimecasa.in/primecasa.webp" />
    <meta property="og:url" content="https://theprimecasa.in" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Prime Casa" />
    <meta property="og:locale" content="en_IN" />

    <!-- ===== SITEMAP ===== -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- ===== PRECONNECT ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- No more Tabler icons CDN – we use @tabler/icons-react -->

    <!-- ===== DEFER MANIFEST (NON-BLOCKING) ===== -->
    <link
      rel="manifest"
      href="/manifest.webmanifest"
      media="print"
      onload="this.media='all'"
    />

    <!-- ===== PRELOAD GOOGLE FONTS CSS ===== -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
    />

    <!-- ===== GOOGLE FONTS (ASYNC) ===== -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
      />
    </noscript>

    <!-- ===== SCHEMA.ORG STRUCTURED DATA ===== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "The Prime Casa",
        "url": "https://theprimecasa.in",
        "logo": "https://theprimecasa.in/primecasa.webp",
        "description": "The Prime Casa is a real estate advisory and property brokerage firm headquartered in Sector 90, Noida, Uttar Pradesh. They specialize in commercial spaces, luxury villas, residential plots, and studio apartments across the National Capital Area.",

          "@type": "ContactPoint",
          "telephone": "+91-8130504183",
          "contactType": "Sales",
          "availableLanguage": ["English", "Hindi"]
        },
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Unit No 1230, TOWER-B, Bhutani Alphathum",
          "addressLocality": "Sector 90",
          "addressRegion": "Noida",
          "postalCode": "201304",
          "addressCountry": "IN"
        },
        "sameAs": [
          "https://www.facebook.com/theprimecasa",
          "https://www.instagram.com/theprimecasa",
          "https://www.youtube.com/@theprimecasa",
          "https://www.linkedin.com/company/the-prime-casa-realty-pvt-ltd"
        ]
      }
